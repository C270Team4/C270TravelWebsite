#done by zihan, enrui, ryan
name: CI Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v4

      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      
      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

    
      - name: Run tests
        run: npm test

      - name: Start application and wait for it to be ready
        env:
          PORT: 3000
        run: |
          # Start the application in the background
          nohup npm start > server.log 2>&1 &

          # Wait until the server responds on port 3000
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:3000/ >/dev/null; then
              echo "Server is up"
              break
            fi
            sleep 1
          done

          # Fail the pipeline if the server did not start
          curl -sSf http://127.0.0.1:3000/ >/dev/null || (echo "Server failed to start"; tail -n 200 server.log; exit 1)


      - name: Performance test – Normal Load (PASS)
        # Tests expected user traffic and verifies baseline performance
        run: npm run perf:normal

      - name: Performance test – Stress Scenario
        # Applies high load to observe behaviour under stress
        run: npm run perf:stress

      - name: Performance limit test
        # Increases load step-by-step to find maximum supported users
        run: npm run perf:limit
