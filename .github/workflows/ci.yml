name: CI Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v4

      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      
      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

    
      - name: Run tests
        run: npm test